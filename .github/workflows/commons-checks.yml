name: Commons static checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: node --check app.js
      - name: Inspect HTML elements and SQL RLS declarations
        run: |
          python3 - <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  self.ids.extend(v for k, v in attrs if k == "id")
          html = Path('index.html').read_text()
          js = Path('app.js').read_text()
          sql = Path('db/schema.sql').read_text().lower()
          p = IDs()
          p.feed(html)
          assert len(p.ids) == len(set(p.ids)), 'Duplicate element ID'
          referenced = set(re.findall(r'\$\("([^"]+)"\)', js))
          missing = referenced - set(p.ids)
          assert not missing, f'JS references missing HTML IDs: {missing}'
          for table in ['communities', 'rooms', 'room_members', 'tasks', 'activity']:
              assert f'alter table public.{table} enable row level security;' in sql
          assert 'key.includes("service_role")' in js, 'Client must reject privileged keys'
          print(f'Checked {len(referenced)} JS element references and five RLS tables.')
          PY
